name: Rebuild public stats
on:
  schedule:
    - cron: "41 * * * *"   # every hour
  workflow_dispatch:
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs/stats/data.json
        env:
          GOATCOUNTER_CODE: comoevent
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}   # read-only API key; without it the visits part is skipped
        run: python3 scripts/build_stats.py
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add docs/stats/data.json feed/stats/seen.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "stats: refresh"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
