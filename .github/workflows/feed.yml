name: Rebuild event feed
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:
jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dateutil
      - run: python3 feed/aggregate.py --max-geocode 40
      - run: cp feed/events.json docs/events.json && cp feed/venues.json docs/venues.json   # same-origin copies for the web app
      - run: python3 scripts/build_event_pages.py   # one page per event for Google's event search + sitemap
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed/events.json feed/cache/geocode.json docs/events.json docs/venues.json
          git add -A docs/e docs/sitemap.xml docs/robots.txt
          git diff --cached --quiet && echo "no change" || (git commit -m "feed: refresh events" && git push)
