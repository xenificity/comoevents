name: Rebuild event feed
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:
jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python3 feed/aggregate.py --max-geocode 40
      - run: cp feed/events.json docs/events.json   # same-origin copy for the web app
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed/events.json feed/cache/geocode.json docs/events.json
          git diff --cached --quiet && echo "no change" || (git commit -m "feed: refresh events" && git push)
