name: CoMoEvents
options:
  bundleIdPrefix: com.xenificity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: TU583LSD8W
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CoMoEvents:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoMoEvents
    info:
      path: CoMoEvents/Info.plist
      properties:
        CFBundleDisplayName: CoMo Events
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        NSLocationWhenInUseUsageDescription: CoMo Events shows events near you on the map. Your location never leaves your phone.
        LSApplicationQueriesSchemes: [tel, maps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xenificity.comoevents
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: false
