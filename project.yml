name: CoMoEvents
options:
  bundleIdPrefix: com.xenificity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: TU583LSD8W
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "17"
targets:
  CoMoEvents:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoMoEvents
    entitlements:
      path: CoMoEvents/CoMoEvents.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.xenificity.comoevents]
    info:
      path: CoMoEvents/Info.plist
      properties:
        CFBundleDisplayName: CoMo Events
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        NSLocationWhenInUseUsageDescription: CoMo Events shows events near you on the map. Your location never leaves your phone.
        LSApplicationQueriesSchemes: [tel, maps]
        NSCameraUsageDescription: CoMo Events uses the camera to scan event QR codes and flyers you point it at.
        NSPhotoLibraryUsageDescription: CoMo Events lets you pick a photo for an event you post, a flyer to scan, or your profile picture.
        NSContactsUsageDescription: CoMo Events shows your contacts so you can pick who to invite. Nothing is uploaded.
        NSCalendarsWriteOnlyAccessUsageDescription: CoMo Events adds the event you chose to your calendar. It never reads your calendar.
        CFBundleURLTypes:
          - CFBundleURLName: com.xenificity.comoevents
            CFBundleURLSchemes: [comoevents]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xenificity.comoevents
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: false
