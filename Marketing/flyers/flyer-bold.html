<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CoMo Events flyer · Bold</title>
<style>
@page{size:8.5in 11in;margin:0}
*{box-sizing:border-box}
html,body{margin:0;width:8.5in;height:11in;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;color:#121214;background:#FFD600;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.08) 1.2px,transparent 1.3px);background-size:.22in .22in;opacity:.7}
.wrap{position:relative;padding:.6in .65in}
.brand{display:flex;align-items:center;gap:.14in;font-weight:900;font-size:18pt}
.brand img{width:.6in;height:.6in;border-radius:.16in;box-shadow:0 10px 24px rgba(0,0,0,.25)}
h1{margin:.5in 0 0;font-size:84pt;line-height:.86;letter-spacing:-.05em;font-weight:900;text-transform:uppercase}
h1 small{display:block;font-size:26pt;letter-spacing:-.02em;text-transform:none;font-weight:800;margin-top:.22in;color:rgba(0,0,0,.72);max-width:4.6in}
.phone{position:absolute;right:.55in;top:4.55in;width:2.5in;height:3.95in;border-radius:.4in .4in 0 0;overflow:hidden;border:5px solid #121214;box-shadow:0 40px 70px rgba(0,0,0,.35);transform:rotate(-4deg);background:#121214}
.phone img{display:block;width:100%}
.list{position:absolute;left:.65in;top:5.1in;font-size:20pt;font-weight:800;line-height:1.55}
.list span{display:block}
.list span::before{content:"→ ";color:rgba(0,0,0,.45)}
.bottom{position:absolute;left:.65in;right:.65in;bottom:.6in;display:flex;gap:.3in}
.qr{flex:1;background:#121214;color:#fff;border-radius:.32in;padding:.22in;display:flex;gap:.22in;align-items:center}
.qr img{width:1.6in;height:1.6in;background:#fff;padding:.08in;border-radius:.14in}
.qr b{display:block;font-size:17pt;line-height:1.1}
.qr small{display:block;color:rgba(255,255,255,.7);font-size:10.5pt;margin-top:.08in;line-height:1.3}
.foot{position:absolute;left:.65in;right:.65in;bottom:.25in;display:flex;justify-content:space-between;font-size:9pt;font-weight:700;color:rgba(0,0,0,.55)}
</style></head>
<body>
<div class="dots"></div>
<div class="wrap">
  <div class="brand"><img src="../../docs/img/icon-512.png" alt="">CoMo Events</div>
  <h1>Don't miss<br>tonight.<small>Every public event in Columbia, MO on one map. Free.</small></h1>
</div>
<div class="list"><span>Parties, music, food</span><span>Campus and downtown</span><span>Live, updated all day</span></div>
<div class="phone"><img src="../../docs/img/02-party.jpg" alt=""></div>
<div class="bottom">
  <div class="qr"><img src="qr-app.svg" alt="QR for the iPhone app"><div><b>iPhone app</b><small>Scan to install</small></div></div>
  <div class="qr"><img src="qr-web.svg" alt="QR for the web app"><div><b>Web map</b><small>Any phone, no install</small></div></div>
</div>
<div class="foot"><span>comoevent.com</span><span>Scan. Go.</span></div>
</body></html>
