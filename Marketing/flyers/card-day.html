<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CoMo Events counter card · Day</title>
<style>
@page{size:4in 6in;margin:0}
*{box-sizing:border-box}
html,body{margin:0;width:4in;height:6in;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;color:#121214;background:#f7f7f9;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wash{position:absolute;inset:0;background:
 radial-gradient(70% 45% at 0% 0%,rgba(255,214,0,.6),transparent 65%),
 radial-gradient(55% 40% at 100% 100%,rgba(140,80,255,.22),transparent 65%)}
.wrap{position:relative;padding:.3in .3in .25in;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:.1in;font-weight:800;font-size:12.5pt}
.brand img{width:.4in;height:.4in;border-radius:.11in}
h1{margin:.2in 0 0;font-size:25pt;line-height:1;letter-spacing:-.03em;font-weight:900}
h1 mark{background:linear-gradient(transparent 55%,#FFD600 55%);color:inherit}
.lead{margin:.1in 0 0;font-size:9.5pt;color:#55555e;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:.06in;margin-top:.14in}
.tags span{font-size:8pt;font-weight:700;padding:.04in .11in;border-radius:999px;background:#fff;box-shadow:0 4px 12px rgba(20,20,40,.1)}
.shot{margin-top:.16in;height:1.55in;border-radius:.18in;overflow:hidden;border:1.5px solid rgba(255,255,255,.25);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block}
.qrs{margin-top:auto;display:flex;gap:.16in}
.qr{flex:1;border-radius:.2in;padding:.12in;background:#fff;text-align:center;box-shadow:0 14px 30px rgba(20,20,40,.14)}
.qr.k{background:#121214;color:#fff}
.qr img{width:100%;display:block;background:#fff;border-radius:.1in;padding:.05in}
.qr b{display:block;font-size:10pt;margin-top:.08in;line-height:1.1}
.qr small{display:block;font-size:7pt;color:#6b6b74;margin-top:.03in}
.qr.k small{color:rgba(255,255,255,.7)}
.foot{margin-top:.12in;font-size:6.5pt;color:#8a8a93;text-align:center}
</style></head>
<body>
<div class="wash"></div>
<div class="wrap">
  <div class="brand"><img src="../../docs/img/icon-512.png" alt="">CoMo Events</div>
  <h1>What's on in <mark>Columbia</mark> tonight?</h1>
  <p class="lead">Every public event in town on one live map. Free.</p>
  <div class="tags"><span>📍 Live map</span><span>💛 Singles · Couples · Groups</span><span>📣 Post your event</span></div>
  <div class="shot"><img src="../../docs/img/01-map.jpg" alt=""></div>
  <div class="qrs">
    <div class="qr k"><img src="qr-app.svg" alt="QR for the iPhone app"><b>iPhone app</b><small>Scan to install</small></div>
    <div class="qr"><img src="qr-web.svg" alt="QR for the web map"><b>Any phone</b><small>Open the web map</small></div>
  </div>
  <div class="foot">comoevent.com · Built by a Mizzou student</div>
</div>
</body></html>
