<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CoMo Events · Live map of Columbia, MO</title>
<meta name="description" content="Every public event in Columbia, Missouri on one live map: Mizzou, downtown, music, parties, markets, library and family events. Free, no account.">
<meta property="og:title" content="CoMo Events · Live map">
<meta property="og:description" content="Every public event in Columbia, Missouri on one live map. Free, no ads.">
<meta property="og:image" content="https://xenificity.github.io/comoevents/img/icon-512.png">
<meta name="theme-color" content="#fff8d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CoMo Events">
<link rel="icon" href="../img/icon-512.png">
<link rel="apple-touch-icon" href="../img/icon-512.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.css" integrity="sha512-DBNed2oEjOrfIRj8Czuzs7padWawLWbA64OoDekn8gs2a3J6WOaR5xXfnFgaxKGpxIuSn/rAo/PsgOgO6PZ/vA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="app.css?v=7">
</head>
<body>
<div id="app">
  <!-- Map tab: full-bleed map with the same floating glass controls as the iPhone app -->
  <section class="screen map-screen" id="screen-map">
    <div id="map" role="application" aria-label="Map of events in Columbia, Missouri"></div>
    <div class="map-top">
      <div class="glass capsule seg" id="audiences"></div>
      <div class="glass capsule seg" id="windows"></div>
      <div class="glass capsule count" id="count"><i class="ic" data-ic="pin"></i><b id="count-n">…</b><span id="count-upd"></span></div>
      <div class="legend" id="categories"></div>
    </div>
    <div class="map-bottom">
      <div class="row">
        <span class="glass capsule label tint" id="nextup-label">Next up</span>
        <button class="glass capsule label" id="all-btn" type="button"><i class="ic" data-ic="list"></i><span id="all-n">All</span></button>
      </div>
      <div class="strip" id="nextup"></div>
    </div>
  </section>

  <!-- Upcoming, Saved, Profile: scrolling pages over the brand wash -->
  <section class="screen page" id="screen-upcoming" hidden>
    <div class="page-inner">
      <header class="page-head">
        <h1>Upcoming</h1>
        <div class="head-actions">
          <button class="glass circle" id="post-btn" type="button" title="Post an event"><i class="ic" data-ic="plus"></i></button>
          <button class="glass circle" id="refresh-btn" type="button" title="Refresh"><i class="ic" data-ic="refresh"></i></button>
        </div>
      </header>
      <div class="glass capsule search"><i class="ic" data-ic="search"></i><input id="search" type="search" placeholder="Search events or venues" autocomplete="off"></div>
      <div class="glass capsule seg wide" id="audiences2"></div>
      <div class="chips" id="categories2"></div>
      <div id="foryou"></div>
      <div class="cards" id="upcoming-list"></div>
      <p class="feed-note" id="feed-note" hidden></p>
    </div>
  </section>

  <section class="screen page" id="screen-saved" hidden>
    <div class="page-inner">
      <header class="page-head"><h1>Saved</h1></header>
      <div class="cards" id="saved-list"></div>
    </div>
  </section>

  <section class="screen page" id="screen-friends" hidden>
    <div class="page-inner">
      <header class="page-head"><h1>Friends</h1></header>
      <div id="friends"></div>
    </div>
  </section>

  <section class="screen page" id="screen-profile" hidden>
    <div class="page-inner">
      <header class="page-head"><h1>Profile</h1></header>
      <div id="profile"></div>
    </div>
  </section>

  <!-- Tab bar -->
  <nav class="tabbar glass" id="tabbar">
    <button data-tab="map" class="on" type="button"><i class="ic" data-ic="map"></i><span>Map</span></button>
    <button data-tab="upcoming" type="button"><i class="ic" data-ic="sparkles"></i><span>Upcoming</span></button>
    <button data-tab="saved" type="button"><i class="ic" data-ic="heart"></i><span>Saved</span><b class="badge" id="saved-badge" hidden></b></button>
    <button data-tab="friends" type="button"><i class="ic" data-ic="people"></i><span>Friends</span></button>
    <button data-tab="profile" type="button"><i class="ic" data-ic="person"></i><span>Profile</span></button>
  </nav>

  <!-- Venue sheet (events at one pin) -->
  <section class="sheet" id="sheet" hidden>
    <div class="sheet-card glass">
      <div class="grabber" id="sheet-close"></div>
      <h2 id="sheet-title"></h2>
      <div class="rows" id="sheet-rows"></div>
    </div>
  </section>

  <!-- Post an event -->
  <section class="detail post" id="post" hidden>
    <div class="inner"><div class="body">
      <header class="page-head"><h1>Post an event</h1><button class="glass circle" id="post-close" type="button" title="Close"><i class="ic" data-ic="back"></i></button></header>
      <form id="post-form" class="glass card pform" autocomplete="off">
        <label>Event title<input name="title" required maxlength="120" placeholder="e.g. Trivia night at Cafe Berlin"></label>
        <label>Type<select name="category"></select></label>
        <div class="lbl">Also show under</div><div class="flow" id="post-extra"></div>
        <label>Starts<input name="start" type="datetime-local" required></label>
        <label class="inline"><input name="hasEnd" type="checkbox"> Has an end time</label>
        <label id="post-end" hidden>Ends<input name="end" type="datetime-local"></label>
        <label>Venue<input name="venue" maxlength="80" placeholder="e.g. Cafe Berlin"></label>
        <label>Address<input name="address" maxlength="120" placeholder="Optional if the venue is known"></label>
        <p class="hint">We place the pin from this. Columbia, MO is assumed.</p>
        <label>Price<input name="price" maxlength="40" placeholder="e.g. Free, $10"></label>
        <label>Link<input name="link" type="url" maxlength="300" placeholder="Tickets or details"></label>
        <label>Tell people about it<textarea name="details" rows="4" maxlength="1500"></textarea></label>
        <label>Your name or organization<input name="submitterName" maxlength="60"></label>
        <label class="inline"><input name="agreed" type="checkbox"> I agree to the <a href="../guidelines.html" target="_blank" rel="noopener">community guidelines</a></label>
        <p class="hint">Public events only. No spam, no hate, no adult content, no private parties, nothing illegal. A moderator checks every post before it appears, usually within a day.</p>
        <p class="err" id="post-err" hidden></p>
        <button class="ylink" id="post-send" type="submit">Post</button>
      </form>
    </div></div>
  </section>

  <!-- Event detail -->
  <section class="detail" id="detail" hidden aria-live="polite"></section>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.js" integrity="sha512-BmEBFbeO0lgfo1PPX5M4B4zxlhZWhOP4Qb1Bn+NVtEI7W1ESwRrLPHpWYqw1WH3QgTqRDNsagD/Fj8mjFCXvSQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="ck-config.js?v=7"></script>
<script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js" async onload="window.__ckLoaded=1"></script>
<script src="cloud.js?v=9"></script>
<script src="app.js?v=7"></script>
</body>
</html>
