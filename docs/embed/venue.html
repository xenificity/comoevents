<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Upcoming events · CoMo Events</title>
<!-- Venue widget: comoevent.com/embed/venue.html?v=<venue-slug>[&n=6][&theme=light|dark|auto]
     Data: docs/embed/v/<slug>.json, written by scripts/build_event_pages.py every feed run. Snippet: each /venues/<slug>/ page. -->
<style>
:root{--ink:#121214;--muted:#6b6b74;--bg:#fff;--line:rgba(127,127,127,.2);--chip:rgba(255,214,0,.28)}
:root[data-theme="dark"]{--ink:#f2f2f5;--muted:#a0a0aa;--bg:#17171c;--line:rgba(255,255,255,.12);--chip:rgba(255,214,0,.2)}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--ink:#f2f2f5;--muted:#a0a0aa;--bg:#17171c;--line:rgba(255,255,255,.12);--chip:rgba(255,214,0,.2)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,Arial,sans-serif;color:var(--ink);background:transparent}
.card{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
header{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;line-height:1.25}
header small{color:var(--muted);font-size:12px}
ul{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
li a{display:flex;gap:12px;align-items:center;padding:9px 14px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
li a:hover{background:var(--chip)}
.d{flex:none;width:44px;padding:4px 0;border-radius:10px;background:var(--chip);text-align:center;line-height:1.1}
.d span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.d b{font-size:18px}
.t{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--muted);font-size:12.5px}
.note{padding:16px 14px;color:var(--muted)}
footer{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px}
footer img{width:18px;height:18px;border-radius:5px}
footer a{color:inherit;font-weight:700}
</style></head><body>
<div class="card">
  <header><h1 id="name">Upcoming events</h1><small id="sub">Columbia, MO</small></header>
  <ul id="list"><li class="note">Loading events…</li></ul>
  <footer><img src="/img/icon-512.png" alt=""><a id="powered" href="https://comoevent.com/" target="_blank" rel="noopener">Powered by CoMo Events</a></footer>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var slug = (q.get("v") || "").toLowerCase();
  var max = Math.min(Math.max(parseInt(q.get("n"), 10) || 6, 1), 20);
  var theme = q.get("theme");
  document.documentElement.setAttribute("data-theme", theme === "dark" || theme === "auto" ? theme : "light");
  var list = document.getElementById("list"), powered = document.getElementById("powered");
  var SITE = "https://comoevent.com";
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
  function note(text) { list.innerHTML = '<li class="note">' + text + "</li>"; }
  if (!/^[a-z0-9-]{1,80}$/.test(slug)) { note('Add <code>?v=venue-slug</code> to the address. Find yours on a <a href="' + SITE + '/venues/" target="_blank" rel="noopener">venue page</a>.'); return; }
  powered.href = SITE + "/venues/" + slug + "/";
  var tz = "America/Chicago";
  var fmt = function (opts) { return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: tz }, opts)); };
  var mon = fmt({ month: "short" }), day = fmt({ day: "numeric" }), wd = fmt({ weekday: "short" }), tm = fmt({ hour: "numeric", minute: "2-digit" });
  fetch("/embed/v/" + slug + ".json", { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (data) {
    if (data.name) {
      document.getElementById("name").textContent = data.name;
      document.title = data.name + " events · CoMo Events";
    }
    document.getElementById("sub").textContent = "Upcoming events" + (data.address ? " · " + data.address.split(",")[0] : "");
    powered.href = data.url || powered.href;
    var now = Date.now() - 3600e3;
    var evs = (data.events || []).filter(function (e) { return new Date(e.e || e.s).getTime() >= now; }).slice(0, max);
    if (!evs.length) { note('No upcoming events are listed right now. <a href="' + esc(powered.href) + '" target="_blank" rel="noopener">See what else is on in Columbia</a>.'); return; }
    list.innerHTML = evs.map(function (e) {
      var s = new Date(e.s);
      var meta = wd.format(s) + (e.a ? "" : " · " + tm.format(s).replace(":00", "")) + (e.p ? " · " + e.p : "");
      return '<li><a href="' + SITE + esc(e.u) + '" target="_blank" rel="noopener"><div class="d"><span>' + mon.format(s) + "</span><b>" + day.format(s) +
        '</b></div><div><div class="t">' + esc(e.t) + '</div><div class="m">' + esc(meta) + "</div></div></a></li>";
    }).join("");
  }).catch(function () {
    note('Events could not be loaded. <a href="' + esc(powered.href) + '" target="_blank" rel="noopener">Open the calendar on CoMo Events</a>.');
  });
})();
</script>
</body></html>
